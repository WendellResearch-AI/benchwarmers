<text x="696" y="53" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#4c4136" text-anchor="start">asks the gateway for</text>
<text x="696" y="73" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#1a1410" text-anchor="start">bench/&lt;collection&gt;</text>
