<text x="96" y="336" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#4c4136" text-anchor="middle">seats a panel</text>
<text x="96" y="352" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#4c4136" text-anchor="middle">or routes a turn</text>
<text x="208" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1a1410" text-anchor="start">Panel</text>
<text x="260" y="140" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#1a1410" text-anchor="start">bench/&lt;collection&gt;</text>
<text x="744" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#4c4136" text-anchor="end">one prompt, several models</text>
<text x="289" y="176" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1a1410" text-anchor="middle">Who sits</text>
<text x="289" y="204" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1a1410" text-anchor="middle">Members</text>
<text x="289" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#4c4136" text-anchor="middle">always seated</text>
<text x="289" y="256" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#990000" text-anchor="middle">Explorers</text>
<text x="289" y="272" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#4c4136" text-anchor="middle">rotate in the model</text>
<text x="289" y="288" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#4c4136" text-anchor="middle">unused longest</text>
<text x="476" y="176" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1a1410" text-anchor="middle">Every answer back</text>
<text x="476" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#4c4136" text-anchor="middle">side by side, labelled</text>
<text x="476" y="212" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#4c4136" text-anchor="middle">by model and seat</text>
<text x="476" y="246" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1a1410" text-anchor="middle">two answers, then 60 s</text>
<text x="476" y="262" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#4c4136" text-anchor="middle">for the rest; a late seat</text>
<text x="476" y="278" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#4c4136" text-anchor="middle">is still recorded</text>
<text x="663" y="176" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1a1410" text-anchor="middle">One summary</text>
<text x="663" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#4c4136" text-anchor="middle">optional, ask for</text>
<text x="663" y="212" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#1a1410" text-anchor="middle">:merged</text>
<text x="663" y="246" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1a1410" text-anchor="middle">the merger sees</text>
<text x="663" y="262" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#4c4136" text-anchor="middle">“Source 1”, “Source 2”,</text>
<text x="663" y="278" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#4c4136" text-anchor="middle">not model names</text>
<text x="208" y="364" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1a1410" text-anchor="start">Route</text>
<text x="260" y="364" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#1a1410" text-anchor="start">bench/&lt;collection&gt;:route</text>
<text x="744" y="364" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#4c4136" text-anchor="end">for agents with tool calls</text>
<text x="289" y="402" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1a1410" text-anchor="middle">One member</text>
<text x="289" y="422" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#4c4136" text-anchor="middle">takes each turn, ranked</text>
<text x="289" y="438" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#4c4136" text-anchor="middle">by verdict score, and is</text>
<text x="289" y="454" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#4c4136" text-anchor="middle">kept for the conversation</text>
<text x="476" y="402" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1a1410" text-anchor="middle">Failover</text>
<text x="476" y="422" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#4c4136" text-anchor="middle">on a 429, an error</text>
<text x="476" y="438" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#4c4136" text-anchor="middle">or silence, the next</text>
<text x="476" y="454" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#4c4136" text-anchor="middle">member takes the turn</text>
<text x="663" y="426" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1a1410" text-anchor="middle">Shadow seat</text>
<text x="663" y="446" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#4c4136" text-anchor="middle">optional: another member</text>
<text x="663" y="462" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#4c4136" text-anchor="middle">answers the same turn</text>
<text x="663" y="478" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#4c4136" text-anchor="middle">in the background,</text>
<text x="663" y="494" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1a1410" text-anchor="middle">for evaluation only</text>
<text x="856" y="256" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1a1410" text-anchor="middle">You check them</text>
<text x="856" y="278" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#4c4136" text-anchor="middle">or the calling agent,</text>
<text x="856" y="294" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#4c4136" text-anchor="middle">against the real work</text>
<text x="856" y="328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1a1410" text-anchor="middle">a verdict per call:</text>
<text x="856" y="344" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#4c4136" text-anchor="middle">useful or not,</text>
<text x="856" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#4c4136" text-anchor="middle">with its real and</text>
<text x="856" y="376" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#4c4136" text-anchor="middle">false claims</text>
<text x="480" y="578" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1a1410" text-anchor="middle">The bench's record</text>
<text x="480" y="598" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#4c4136" text-anchor="middle">calls and verdicts, daily health probes, the review suite</text>
<text x="480" y="614" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#4c4136" text-anchor="middle">choose who sits on the next panel and rank the members for route mode</text>
</svg>
