<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="656" viewBox="0 0 960 656" role="img" aria-labelledby="flow-title flow-desc">
<title id="flow-title">How Benchwarmers works: a panel or a route, then verdicts</title>
<desc id="flow-desc">Your app or agent, set up from the Connect page (opencode, VS Code, Zed, Codex, Continue, goose, or any OpenAI, Anthropic, Gemini or Ollama-format client), asks the gateway for one of your collections. The gateway takes one of two lanes. Panel, bench/&lt;collection&gt;: the collection's members, always seated, and explorer seats that rotate in the model unused longest all answer the same prompt; every answer comes back side by side, labelled by model and seat; once two have answered the rest get 60 seconds more, and a late seat is still recorded; with :merged, an optional merger writes one summary, reading the answers as Source 1, Source 2 and so on, not by model name. Route, bench/&lt;collection&gt;:route, for agents with tool calls: one member takes each turn, ranked by verdict score and kept for the conversation; on a 429, an error or silence the next member takes the turn; an optional shadow seat answers the same turn in the background, for evaluation only, and its answer does not go back to you. You or the calling agent check the answers against the real work and record a verdict per call: useful or not, with its real and false claims. The bench's record of calls and verdicts, daily health probes and the review suite chooses who sits on the next panel and ranks the members for route mode.</desc>
