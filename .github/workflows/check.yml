# Every self-check (scripts/check.py) on Linux, macOS and Windows, Python 3.11
# to 3.13: one Windows maintainer cannot honestly tick the other two by hand.
#
# Not here, on purpose:
# - The export gate (scripts/export_check.py): it holds the very strings it
#   blocks, so it stays in the private repo and runs there before each push.
#   check.py skips it when the file is absent.
# - A secret scan (gitleaks): the export gate already refuses anything shaped
#   like a key before each push, and gitleaks-action wants a licence key for an
#   organisation's repo. Add it when pull requests from forks arrive.
# - pull_request: a push run already checks every branch, PR heads included;
#   add the trigger when the repo is public and forks can open PRs.
name: check

on: push

permissions:
  contents: read

# A newer push to the same branch makes the older run moot (macOS minutes cost ten times).
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      # scripts/test_client.py runs the real llm CLI against a fake server; these
      # are the versions it was last verified with. Bump them on purpose.
      - run: python -m pip install llm==0.34 openai==3.7.0
      # A temp copy of tests/fixtures/data as BENCHWARMERS_HOME and an empty
      # temp folder as LLM_USER_PATH: nothing of a real install is read.
      - run: python scripts/check.py --fixtures
