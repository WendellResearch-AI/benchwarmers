<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="494" viewBox="0 0 900 494" role="img" aria-labelledby="bench-call-title bench-call-desc">
<title id="bench-call-title">A real Benchwarmers call: one command, 7 seats at once, then verdicts</title>
<desc id="bench-call-desc">A terminal types: bench ask core "What happens when path doesn't exist? Python 3.12" -f load.py. The file load.py is a Python function that opens a file inside try, sets data to None in except OSError as err, and afterwards logs a warning that uses err. Benchwarmers seats panel p20261120-222954-eb8d on bench/core: 5 members and 2 explorers, all asked at once, and every answer comes back labelled by model and seat, in the order they finished: member mercury-3 at 2.1 s: err is cleared when the except block ends, so log.warning raises NameError (useful); member Beam-1.0-501B-A23B at 3.5 s: Caught as OSError: data is None, so it logs a warning with err, returns None (confidently wrong); member gemini-3.8-flash at 7.5 s: Python deletes err on leaving the except block: log.warning raises UnboundLocalError (useful); member big-pickle at 8.1 s: err is cleared after the except block: UnboundLocalError, and nothing is logged (useful); explorer 2 gemma-4-31b-it at 11.9 s: Caught by the OSError block; it logs a warning with the error, returns None (confidently wrong); explorer Qwen3.8-27B at 12.5 s: Caught as OSError: the warning is logged and the function returns None (confidently wrong); member kimi-k3.1-pro at 96.4 s: err is deleted after the block: UnboundLocalError; nothing logged, no None (useful). Verdicts: 4 useful · 3 confidently wrong (Python deletes err when the except block ends) They go on the record, and the bench trusts them less next time. Real times, played compressed.</desc>
<defs><clipPath id="typed"><rect x="51" y="52" width="813" height="26"/></clipPath></defs>
